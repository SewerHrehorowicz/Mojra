<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StoryTeller — Interaktywne Audiobooki &amp; Studio</title>
    <link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body data-theme="" data-imageless="" data-imageless-locked="" data-ui-scale="">
    <div class="app-root" id="app">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <span class="brand-logo">StoryTeller</span>
          <span class="brand-logo brand-logo-short">ST</span>
          <button class="topbar-tab" id="tab-library" type="button" action="SwitchView" data-view="library" title="Biblioteka">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="M15.2 4.6a1 1 0 0 1 .8-1.2l2.9-.5a1 1 0 0 1 1.2.8l2.6 14.8a1 1 0 0 1-.8 1.2l-2.9.5a1 1 0 0 1-1.2-.8z"/></svg>
            <span class="tab-label">Biblioteka</span>
          </button>
          <button class="topbar-tab" id="tab-editor" type="button" action="SwitchView" data-view="editor" title="Node Studio">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="9" y="15" width="6" height="6" rx="1"/><path d="M6 9v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9"/><path d="M12 13v2"/></svg>
            <span class="tab-label">Node Studio</span>
          </button>
        </div>
        <div class="topbar-right" id="topbar-right">
          <button class="top-action-btn topbar-hamburger-btn" id="btn-topbar-menu" type="button" data-topbar-menu-toggle="true" title="Menu" aria-label="Menu">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topbar-actions-menu" id="topbar-actions-menu">
            <button class="top-action-btn" id="btn-toggle-imageless" type="button" action="ToggleImageless" data-imageless-locked="" title="">
              <svg class="action-icon" id="icon-imageless-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <svg class="action-icon hidden" id="icon-imageless-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M10.41 4H19a2 2 0 0 1 2 2v8.59"/><path d="M21 15l-3.09-3.09"/><path d="M5 5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 1.41-.59"/><polyline points="15 15 5 21"/></svg>
            </button>
            <button class="top-action-btn" id="btn-toggle-ui-scale" type="button" action="ToggleUIScale" title="">
              <svg class="action-icon" id="icon-zoom-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              <svg class="action-icon hidden" id="icon-zoom-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button class="top-action-btn" id="btn-toggle-theme" type="button" action="ToggleTheme" title="Przełącz motyw Jasny / Ciemny">
              <svg class="action-icon" id="icon-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="action-icon hidden" id="icon-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="top-action-btn desktop-only-btn" id="btn-toggle-fullscreen" type="button" action="ToggleFullscreen" title="Przełącz pełny ekran">
              <svg class="action-icon" id="icon-fullscreen-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
              <svg class="action-icon hidden" id="icon-fullscreen-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
          <button class="top-action-btn btn-quit-app" id="btn-quit-app" type="button" action="QuitApp" title="Zamknij aplikację StoryTeller">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </header>
      <main class="workspace" id="workspace"></main>
      <div class="modals-root" id="modals-root"></div>
      <div class="toast hidden" id="toast-banner"></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
