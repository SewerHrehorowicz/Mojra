    <g id="wave-lines-216" stroke-width="1" stroke-linecap="butt">
      <path d="M 2,13v2 M 5,13v2 M 8,12v4 M 11,13v2 M 14,12v4 M 17,11v6 M 20,13v2 M 23,13v2 M 26,12v4 M 29,13v2
               M 35,10v8 M 38,5v18 M 41,3v22 M 44,6v16 M 47,8v12 M 50,4v20 M 53,9v10 M 56,12v4 M 59,13v2
               M 62,8v12 M 65,2v24 M 68,4v20 M 71,3v22 M 74,7v14 M 77,9v10 M 80,4v20 M 83,6v16 M 86,10v8 M 89,13v2 M 92,13v2
               M 95,9v10 M 98,3v22 M 101,2v24 M 104,5v18 M 107,8v12 M 110,3v22 M 113,4v20 M 116,7v14 M 119,5v18 M 122,10v8 M 125,13v2 M 128,13v2
               M 131,7v14 M 134,2v24 M 137,4v20 M 140,3v22 M 143,7v14 M 146,2v24 M 149,5v18 M 152,8v12 M 155,5v18 M 158,10v8 M 161,13v2
               M 164,8v12 M 167,4v20 M 170,3v22 M 173,6v16 M 176,4v20 M 179,8v12 M 182,11v6 M 185,13v2
               M 188,13v2 M 191,12v4 M 194,13v2 M 197,13v2 M 200,12v4 M 203,13v2 M 206,13v2 M 209,13v2 M 212,13v2" />
    </g>

    <!-- Wide 510x30 Thin 1px Gray Vertical Lines Waveform -->
    <g id="wave-lines-510" stroke-width="1" stroke-linecap="butt">
      <path d="M 3,14v2 M 7,14v2 M 11,14v2 M 15,13v4 M 19,14v2 M 23,14v2 M 27,13v4 M 31,12v6 M 35,14v2 M 39,14v2 M 43,13v4 M 47,14v2 M 51,14v2
               M 59,10v10 M 63,5v20 M 67,3v24 M 71,2v26 M 75,6v18 M 79,3v24 M 83,2v26 M 87,7v16 M 91,4v22 M 95,6v18 M 99,11v8 M 103,14v2 M 107,14v2
               M 115,8v14 M 119,2v26 M 123,4v22 M 127,2v26 M 131,7v16 M 135,4v22 M 139,2v26 M 143,6v18 M 147,3v24 M 151,8v14 M 155,5v20 M 159,3v24 M 163,7v16 M 167,12v6 M 171,14v2 M 175,14v2 M 179,14v2
               M 183,9v12 M 187,3v24 M 191,1v28 M 195,3v24 M 199,6v18 M 203,8v14 M 207,2v26 M 211,5v20 M 215,7v16 M 219,3v24 M 223,6v18 M 227,9v12 M 231,4v22 M 235,7v16 M 239,12v6 M 243,14v2 M 247,14v2
               M 251,9v12 M 255,4v22 M 259,2v26 M 263,4v22 M 267,6v18 M 271,4v22 M 275,9v12 M 279,5v20 M 283,2v26 M 287,6v18 M 291,4v22 M 295,3v24 M 299,8v14 M 303,13v4 M 307,14v2 M 311,14v2 M 315,14v2
               M 319,8v14 M 323,3v24 M 327,2v26 M 331,3v24 M 335,7v16 M 339,4v22 M 343,2v26 M 347,6v18 M 351,5v20 M 355,3v24 M 359,7v16 M 363,5v20 M 367,4v22 M 371,9v12 M 375,13v4 M 379,14v2 M 383,14v2
               M 387,9v12 M 391,4v22 M 395,2v26 M 399,4v22 M 403,7v16 M 407,5v20 M 411,2v26 M 415,6v18 M 419,4v22 M 423,3v24 M 427,7v16 M 431,6v18 M 435,4v22 M 439,8v14 M 443,11v8 M 447,13v4 M 451,14v2
               M 455,14v2 M 459,14v2 M 463,13v4 M 467,13v4 M 471,14v2 M 475,14v2 M 479,13v4 M 483,14v2 M 487,14v2 M 491,14v2 M 495,14v2 M 499,14v2 M 503,14v2 M 507,14v2" />
    </g>

    <style>
      .bg { fill: #050505; }
      .panel { fill: #000000; stroke: #242424; stroke-width: 1; }
      .div { stroke: #1a1a1a; stroke-width: 1; }
      .line-strong { stroke: #525252; stroke-width: 1; }
      .line-subtle { stroke: #242424; stroke-width: 1; }

      /* Genuine App Fonts: Lato (--font-sans) & Aleo (--font-serif) */
      .sec-num { fill: #666666; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
      .sec-tag { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; letter-spacing: 1.2px; text-anchor: end; }

      .node-title { fill: #ffffff; font-family: "Aleo", serif; font-size: 19px; font-weight: 700; }
      .modal-title { fill: #ffffff; font-family: "Aleo", serif; font-size: 24px; font-weight: 700; }
      .chapter-kicker { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
      .prose { fill: #c8c8c8; font-family: "Aleo", serif; font-size: 14px; font-weight: 400; }

      .meta-key { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; }
      .meta-val { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 400; }
      .meta-placeholder { fill: #949494; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 300; }
      .timer { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; text-anchor: end; }
      .timer-live { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 700; text-anchor: end; }

      .icon { fill: none; stroke: #c8c8c8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-active { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-muted { fill: none; stroke: #949494; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .bracket { fill: none; stroke: #ffffff; stroke-width: 1.1; }
      .playhead { stroke: #ffffff; stroke-width: 1; }
    </style>

    <!-- App Icons (15x15) -->
    <g id="ico-mic">
      <rect x="5.2" y="1.5" width="4.6" height="8" rx="2.3" />
      <path d="M2.5 7.2v1.2a5 5 0 0 0 10 0V7.2" />
      <line x1="7.5" y1="13.4" x2="7.5" y2="15.5" />
      <line x1="5" y1="15.5" x2="10" y2="15.5" />
    </g>

    <g id="ico-plus">
      <line x1="7.5" y1="3" x2="7.5" y2="12" />
      <line x1="3" y1="7.5" x2="12" y2="7.5" />
    </g>

    <g id="ico-trash">
      <polyline points="2.5 4 12.5 4" />
      <path d="M11 4l-.6 8.5H4.6L4 4" />
      <line x1="6.3" y1="6.5" x2="6.3" y2="10.2" />
      <line x1="8.7" y1="6.5" x2="8.7" y2="10.2" />
    </g>

    <g id="ico-close">
      <line x1="3.5" y1="3.5" x2="11.5" y2="11.5" />
      <line x1="11.5" y1="3.5" x2="3.5" y2="11.5" />
    </g>

    <g id="ico-play">
      <polygon fill="#ffffff" stroke="none" points="4.5,3 12.5,7.5 4.5,12" />
    </g>

    <g id="ico-stop">
      <rect fill="#ffffff" stroke="none" x="4" y="4" width="7" height="7" />
    </g>

    <!-- Universal 4-Corner Selection Brackets for 22x22 Icon Toggle -->
    <g id="btn-brackets">
      <polyline class="bracket" points="0,5 0,0 5,0" />
      <polyline class="bracket" points="17,0 22,0 22,5" />
      <polyline class="bracket" points="0,17 0,22 5,22" />
      <polyline class="bracket" points="17,22 22,22 22,17" />
    </g>
  </defs>

  <!-- Backdrop -->
  <rect class="bg" x="0" y="0" width="1440" height="900" />
  <line class="div" x1="484" y1="36" x2="484" y2="864" />

  <!-- ===================================================================== -->
  <!-- LEFT COLUMN: 320PX INSPECTOR STATES                                   -->
  <!-- ===================================================================== -->

  <!-- 01 / STAN SPOCZYNKU -->
  <g transform="translate(48, 36)">
    <text class="sec-num" x="0" y="12">01 / STAN SPOCZYNKU</text>
    <text class="sec-tag" x="320" y="12">WIERSZ VOICE:</text>

    <g transform="translate(0, 28)">
      <rect class="panel" x="0" y="0" width="320" height="168" />

      <text class="node-title" x="18" y="34">Kanał kwarantanny</text>

      <!-- id: -->
      <text class="meta-key" x="18" y="68">id:</text>
      <text class="meta-val" x="64" y="68">kanal_kwarantanny</text>
      <line class="line-strong" x1="64" y1="75" x2="302" y2="75" />

      <!-- image: -->
      <text class="meta-key" x="18" y="102">image:</text>
      <text class="meta-val" x="64" y="102">images/kanal_kwarantanny.png</text>
      <polyline class="icon-muted" points="266,98 269.5,101.5 273,98" />
      <line class="line-strong" x1="64" y1="109" x2="277" y2="109" />
      <g class="icon" transform="translate(286, 93)">
        <use href="#ico-plus" />
      </g>

      <!-- voice: -->
      <text class="meta-key" x="18" y="136">voice:</text>
      <text class="meta-placeholder" x="64" y="136">— brak —</text>
      <polyline class="icon-muted" points="244,132 247.5,135.5 251,132" />
      <line class="line-strong" x1="64" y1="143" x2="255" y2="143" />

      <g class="icon" transform="translate(263, 127)">
        <use href="#ico-plus" />
      </g>
      <g class="icon" transform="translate(286, 126.5)">
        <use href="#ico-mic" />
      </g>
    </g>
  </g>

  <!-- 02 / NAGRYWANIE -->
  <g transform="translate(48, 268)">
    <text class="sec-num" x="0" y="12">02 / NAGRYWANIE</text>
    <text class="sec-tag" x="320" y="12">CIENKIE SZARE LINIE 1PX</text>

    <g transform="translate(0, 28)">
      <rect class="panel" x="0" y="0" width="320" height="156" />

      <text class="node-title" x="18" y="34">Kanał kwarantanny</text>

      <!-- voice: -->
      <text class="meta-key" x="18" y="68">voice:</text>
      <text class="meta-val" x="64" y="68">voice/kanal_kwarantanny.flac</text>
      <polyline class="icon-muted" points="244,64 247.5,67.5 251,64" />
      <line class="line-strong" x1="64" y1="75" x2="255" y2="75" />

      <g class="icon-muted" transform="translate(263, 59)">
        <use href="#ico-plus" />
      </g>
      <g transform="translate(282.5, 55.5)">
        <use href="#btn-brackets" />
        <g class="icon-active" transform="translate(3.5, 3)">
          <use href="#ico-mic" />
        </g>
      </g>

      <!-- Single-Row Live Recording Strip -->
      <g transform="translate(18, 98)">
        <g transform="translate(0, 6.5)">
          <use href="#ico-stop" />
        </g>

        <g transform="translate(22, 0)">
          <use href="#wave-lines-live-216" />
          <line class="playhead" x1="142" y1="1" x2="142" y2="27" />
        </g>

        <text class="timer-live" x="284" y="18">0:08</text>
      </g>
    </g>
  </g>

  <!-- 03 / PRZYCINANIE -->
  <g transform="translate(48, 488)">
    <text class="sec-num" x="0" y="12">03 / PRZYCINANIE</text>
    <text class="sec-tag" x="320" y="12">PLAYHEAD 1PX + NAROŻNIKI ⎡ ⎤</text>

    <g transform="translate(0, 28)">
      <rect class="panel" x="0" y="0" width="320" height="156" />

      <text class="node-title" x="18" y="34">Kanał kwarantanny</text>

      <!-- voice: -->
      <text class="meta-key" x="18" y="68">voice:</text>
      <text class="meta-val" x="64" y="68">voice/kanal_kwarantanny.flac</text>
      <polyline class="icon-muted" points="244,64 247.5,67.5 251,64" />
      <line class="line-strong" x1="64" y1="75" x2="255" y2="75" />

      <g class="icon-muted" transform="translate(263, 59)">
        <use href="#ico-plus" />
      </g>
      <g transform="translate(282.5, 55.5)">
        <use href="#btn-brackets" />
        <g class="icon-active" transform="translate(3.5, 3)">
          <use href="#ico-mic" />
        </g>
      </g>

      <!-- Single-Row Trim Strip (Thin 1px Gray Lines + 1px White Playhead + Corner Brackets) -->
      <g transform="translate(18, 98)">
        <g transform="translate(0, 6.5)">
          <use href="#ico-play" />
        </g>

        <g transform="translate(22, 0)">
          <!-- Trimmed out ends: dark gray #292929 -->
          <g clip-path="url(#clip-left-320)" stroke="#292929">
            <use href="#wave-lines-216" />
          </g>
          <g clip-path="url(#clip-right-320)" stroke="#292929">
            <use href="#wave-lines-216" />
          </g>
          <!-- Active selection: thin 1px gray lines #7a7a7a -->
          <g clip-path="url(#clip-mid-320)" stroke="#7a7a7a">
            <use href="#wave-lines-216" />
          </g>

          <!-- Solid 1px white playhead for scrubbing/seeking -->
          <line class="playhead" x1="101" y1="0" x2="101" y2="28" />

          <!-- Left & Right 4-Corner Trim Brackets -->
          <polyline class="bracket" points="32,6 32,0 38,0" />
          <polyline class="bracket" points="32,22 32,28 38,28" />
          <polyline class="bracket" points="180,0 186,0 186,6" />
          <polyline class="bracket" points="180,28 186,28 186,22" />
        </g>

        <text class="timer" x="264" y="18">0:11</text>
        <g class="icon-muted" transform="translate(269, 6.5)">
          <use href="#ico-trash" />
        </g>
      </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT COLUMN: 04 / WIDOK TREŚCI SCENY (#MODAL-SCENE-TEXT)             -->
  <!-- ===================================================================== -->
  <g transform="translate(532, 36)">
    <text class="sec-num" x="0" y="12">04 / EDYTOR TREŚCI SCENY (#MODAL-SCENE-TEXT)</text>
    <text class="sec-tag" x="860" y="12">#TOPBAR WIDOCZNY • NAGRYWANIE NAD TEKSTEM</text>

    <g transform="translate(0, 28)">
      <rect class="panel" x="0" y="0" width="860" height="800" />

      <!-- ROW 1: #topbar -->
      <line class="line-subtle" x1="0" y1="40" x2="860" y2="40" />
      <text fill="#ffffff" font-family="Aleo, serif" font-size="13" font-weight="700" x="18" y="25">M Mojra</text>
      <line class="line-subtle" x1="84" y1="12" x2="84" y2="28" />
      <line stroke="#949494" stroke-width="1.4" x1="98" y1="14" x2="98" y2="26" />
      <line stroke="#949494" stroke-width="1.4" x1="102" y1="15" x2="102" y2="26" />
      <line stroke="#949494" stroke-width="1.4" x1="106" y1="14" x2="106" y2="26" />
      <line stroke="#949494" stroke-width="1.4" x1="110" y1="15" x2="112.5" y2="26" />

      <text fill="#c8c8c8" font-family="Lato, sans-serif" font-size="12" font-weight="400" text-anchor="middle" x="430" y="25">Nie bój się policji rzecznej</text>

      <g class="icon-muted" transform="translate(826, 13)">
        <use href="#ico-close" />
      </g>

      <!-- ROW 2: Book Page Content -->
      <g transform="translate(120, 82)">
        <text class="chapter-kicker" x="0" y="0">ZATOPIONA ŚLUZA</text>
        <text class="modal-title" x="0" y="30">Kanał kwarantanny</text>

        <!-- Header Right Icons: Mic (Active with 4-corner brackets), Settings, Close -->
        <g transform="translate(536, 11)">
          <use href="#btn-brackets" />
          <g class="icon-active" transform="translate(3.5, 3)">
            <use href="#ico-mic" />
          </g>
        </g>
        <circle cx="580" cy="22" r="5.5" fill="none" stroke="#949494" stroke-width="1.4" />
        <g class="icon-muted" transform="translate(604, 14.5)">
          <use href="#ico-close" />
        </g>

        <line class="line-subtle" x1="0" y1="46" x2="620" y2="46" />

        <!-- Single-Row Audio Recorder/Trimmer (Thin 1px Gray Lines + 1px Playhead + Corner Brackets) -->
        <g transform="translate(0, 64)">
          <g transform="translate(0, 7.5)">
            <use href="#ico-play" />
          </g>

          <g transform="translate(28, 0)">
            <g clip-path="url(#clip-left-modal)" stroke="#292929">
              <use href="#wave-lines-510" />
            </g>
            <g clip-path="url(#clip-right-modal)" stroke="#292929">
              <use href="#wave-lines-510" />
            </g>
            <g clip-path="url(#clip-mid-modal)" stroke="#7a7a7a">
              <use href="#wave-lines-510" />
            </g>

            <!-- 1px Solid White Playhead -->
            <line class="playhead" x1="210" y1="0" x2="210" y2="30" />

            <!-- Left & Right 4-corner bracket markers -->
            <polyline class="bracket" points="54,6 54,0 60,0" />
            <polyline class="bracket" points="54,24 54,30 60,30" />
            <polyline class="bracket" points="446,0 452,0 452,6" />
            <polyline class="bracket" points="446,30 452,30 452,24" />
          </g>

          <text class="timer" x="576" y="19">0:17</text>
          <g class="icon-muted" transform="translate(586, 7.5)">
            <use href="#ico-mic" />
          </g>
          <g class="icon-muted" transform="translate(606, 7.5)">
            <use href="#ico-trash" />
          </g>
        </g>

        <!-- Scene Prose directly underneath -->
        <g transform="translate(0, 132)">
          <text class="prose" x="0" y="0">Nocna szpica pod komendą sierżanta Niedźwiedzia odbiła od głównego koryta</text>
          <text class="prose" x="0" y="25">w wąski, wyłożony cegłą kanał dawnej kwarantanny. Nad wodą wisiał tu ciężki</text>
          <text class="prose" x="0" y="50">odór zardzewiałego żelaza i gnijącego drewna, a wysokie mury porastał śliski,</text>
          <text class="prose" x="0" y="75">czarny mech.</text>

          <text class="prose" x="0" y="120">Drogę na północ zagradzały potężne wrota starej śluzy oraz przycumowana</text>
          <text class="prose" x="0" y="145">do nich, nawpół zatopiona barka szpitalna z czasów wielkiej zarazy.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
