<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <!-- Clip paths for active vs trimmed-out regions on the 216px inspector waveform -->
    <clipPath id="clip-left-320">
      <rect x="0" y="0" width="32" height="28" />
    </clipPath>
    <clipPath id="clip-mid-320">
      <rect x="32" y="0" width="154" height="28" />
    </clipPath>
    <clipPath id="clip-right-320">
      <rect x="186" y="0" width="30" height="28" />
    </clipPath>

    <!-- Clip paths for active vs trimmed-out regions on the 510px modal waveform -->
    <clipPath id="clip-left-modal">
      <rect x="0" y="0" width="54" height="30" />
    </clipPath>
    <clipPath id="clip-mid-modal">
      <rect x="54" y="0" width="398" height="30" />
    </clipPath>
    <clipPath id="clip-right-modal">
      <rect x="452" y="0" width="58" height="30" />
    </clipPath>

    <!-- Thin 1px Gray Vertical Lines Waveform for Live Recording (up to x=142 of 216) -->
