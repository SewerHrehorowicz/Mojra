      <path stroke="#7a7a7a"
        d="M 2,13v2 M 5,13v2 M 8,11v6 M 11,6v16 M 14,3v22 M 17,5v18 M 20,8v12 M 23,4v20 M 26,7v14 M 29,11v6 M 32,13v2 M 35,13v2
           M 38,9v10 M 41,3v22 M 44,2v24 M 47,5v18 M 50,3v22 M 53,7v14 M 56,4v20 M 59,6v16 M 62,10v8 M 65,13v2 M 68,13v2
           M 71,8v12 M 74,3v22 M 77,2v24 M 80,5v18 M 83,7v14 M 86,3v22 M 89,5v18 M 92,8v12 M 95,4v20 M 98,9v10 M 101,13v2 M 104,13v2
           M 107,8v12 M 110,2v24 M 113,4v20 M 116,3v22 M 119,7v14 M 122,2v24 M 125,5v18 M 128,8v12 M 131,4v20 M 134,3v22 M 137,6v16 M 140,4v20" />
    </g>

