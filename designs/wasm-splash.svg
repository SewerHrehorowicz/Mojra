<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080">
  <defs>
    <!-- 24px (1G) grid pattern -->
    <pattern id="grid24" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141414" stroke-width="1" />
    </pattern>

    <!-- Heavy atmospheric dark vignette over cover artwork -->
    <radialGradient id="coverStageVignette" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.42" />
      <stop offset="62%" stop-color="#000000" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.97" />
    </radialGradient>

    <style>
      .bg { fill: #000000; }
      .card { fill: #050505; stroke: #222222; stroke-width: 1; }
      .card-hi { fill: #050505; stroke: #525252; stroke-width: 1; }
      .hdr { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2.2px; }
      .sub { fill: #787878; font-family: "SF Mono", Menlo, monospace; font-size: 10px; letter-spacing: 1.4px; }
      .num { fill: #ffffff; font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
      .tag { fill: #888888; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 11px; letter-spacing: 0.3px; }
      .win-bg { fill: #000000; stroke: #222222; stroke-width: 1; }
      .win-top { fill: #050505; stroke: #1a1a1a; stroke-width: 1; }
      .win-label { fill: #888888; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 9.5px; font-weight: 600; letter-spacing: 1.8px; }

      .sp-title-hero { fill: #ffffff; font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 400; letter-spacing: 0.4px; }
      .sp-author-hero { fill: #9a9a9a; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 2.8px; }
      .sp-desc-hero { fill: #b0b0b0; font-family: Georgia, "Times New Roman", serif; font-size: 14px; font-style: italic; }

      .sp-title-sm { fill: #ffffff; font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 400; letter-spacing: 0.3px; }
      .sp-author-sm { fill: #909090; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 8.5px; font-weight: 600; letter-spacing: 2.2px; }
      .sp-desc-sm { fill: #9e9e9e; font-family: Georgia, "Times New Roman", serif; font-size: 11px; font-style: italic; }
      .sp-badge { fill: #787878; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 8.5px; font-weight: 600; letter-spacing: 2.2px; }
    </style>

    <!-- Mini topbar icon (playbook.svg 15x15) -->
    <g id="ico-topbar-playbook">
      <path d="M1 3.5C3 2.6 5.8 2.8 8 4.1c2.2-1.3 5-1.5 7-.6V12c-2-.9-4.8-.6-7 .6-2.2-1.2-5-1.5-7-.6V3.5z" fill="none" stroke="#ffffff" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.5 5.6l4.1 2.5-4.1 2.5V5.6z" fill="#ffffff"/>
    </g>

    <!-- Mini topbar Mojra symbol (mojra.svg 14x14) -->
    <g id="ico-topbar-mojra">
      <line x1="2" y1="2" x2="2" y2="12" stroke="#ffffff" stroke-width="1.2" />
      <line x1="12" y1="2" x2="12" y2="12" stroke="#ffffff" stroke-width="1.2" />
      <path d="M2 2 L7 7.2 L12 2" fill="none" stroke="#ffffff" stroke-width="1.2" />
      <line x1="7" y1="7.2" x2="7" y2="12" stroke="#ffffff" stroke-width="1" />
      <circle cx="7" cy="7.2" r="1.8" fill="#000000" stroke="#ffffff" stroke-width="1.1" />
    </g>

    <!-- Frameless Circle Play Icon (play.svg, 48x48, NO square border) -->
    <g id="play-frameless-disc-lg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M24 2a22 22 0 1 0 0 44 22 22 0 0 0 0-44zm-5.2 12.2 16.2 9.8-16.2 9.8V14.2z" fill="#ffffff"/>
    </g>

    <!-- Frameless Circle Play Icon (play.svg, 38x38, NO square border) -->
    <g id="play-frameless-disc-sm">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M19 2a17 17 0 1 0 0 34 17 17 0 0 0 0-34zm-4 9.5 12.5 7.5-12.5 7.5v-15z" fill="#ffffff"/>
    </g>

    <!-- Frameless Playbook Open-Book + Play Icon (44x44) -->
    <g id="play-frameless-playbook-sm">
      <path d="M 3 9.5 C 8.5 7, 15.8 7.8, 22 11.2 C 28.2 7.8, 35.5 7, 41 9.5 V 33 C 35.5 30.5, 28.2 31.3, 22 34.7 C 15.8 31.3, 8.5 30.5, 3 33 Z"
        fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 4.5 37 C 10 35, 16.5 35.7, 22 38.8 C 27.5 35.7, 34 35, 39.5 37"
        fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 18 15.4 L 29.2 22.2 L 18 29 Z" fill="#ffffff" />
    </g>

    <clipPath id="hero-viewport-clip">
      <rect x="1" y="37" width="858" height="454" />
    </clipPath>

    <clipPath id="sm-viewport-clip">
      <rect x="1" y="25" width="446" height="246" />
    </clipPath>

    <clipPath id="standalone-viewport-clip">
      <rect x="1" y="1" width="446" height="270" />
    </clipPath>
  </defs>

  <!-- MASTER BACKGROUND -->
  <rect width="1680" height="1080" class="bg" />
  <rect width="1680" height="1080" fill="url(#grid24)" />

  <!-- SHEET HEADER -->
  <text x="56" y="48" class="hdr">MOJRA — WARIANT 02 Z OPISEM KSIĄŻKI + JAK PROMOWAĆ IKONĘ PLAYBOOK BEZ JEJ POWTARZANIA</text>
  <text x="1624" y="48" text-anchor="end" class="sub">OKŁADKA W TLE • OPIS KSIĄŻKI • CZYSTY PLAY BEZ RAMKI</text>
  <line x1="56" y1="64" x2="1624" y2="64" stroke="#242424" stroke-width="1" />

  <!-- ================================================================================= -->
  <!-- TOP HERO SHOWCASE: WARIANT 02 Z OPISEM KSIĄŻKI (WDROŻONY)                         -->
  <!-- ================================================================================= -->
  <g transform="translate(56, 86)">
    <rect width="1568" height="536" class="card-hi" />
    <text x="28" y="32" class="num">02 / ATMOSFERYCZNA OKŁADKA W TLE + TYTUŁ + AUTOR + OPIS KSIĄŻKI + CZYSTY PLAY BEZ RAMKI</text>
    <line x1="28" y1="48" x2="1540" y2="48" stroke="#222222" stroke-width="1" />

    <!-- Large 1:1 preview of the WASM Window (860 x 492) -->
    <g transform="translate(28, 64)">
      <rect width="860" height="456" class="win-bg" />
      <rect width="860" height="36" class="win-top" />
      <g transform="translate(12, 10)">
        <use href="#ico-topbar-playbook" />
        <text x="24" y="11" class="win-label">MOJRA.PLAYBOOK</text>
      </g>
      <g transform="translate(834, 13)" stroke="#808080" stroke-width="1.3">
        <line x1="0" y1="0" x2="10" y2="10" />
        <line x1="10" y1="0" x2="0" y2="10" />
      </g>

      <g clip-path="url(#hero-viewport-clip)">
        <image href="../books/nie-boj-sie-policji-rzecznej/images/cover.jpg" x="1" y="37" width="858" height="454" preserveAspectRatio="xMidYMid slice" opacity="0.48" />
        <rect x="1" y="37" width="858" height="454" fill="url(#coverStageVignette)" />

        <!-- Centered Editorial Block -->
        <text x="430" y="182" text-anchor="middle" class="sp-title-hero">Nie bój się policji rzecznej</text>
        <text x="430" y="212" text-anchor="middle" class="sp-author-hero">TYTUS CZYŻEWSKI</text>
        <line x1="412" y1="230" x2="448" y2="230" stroke="#3a3a3a" stroke-width="1" />

        <text x="430" y="258" text-anchor="middle" class="sp-desc-hero">Mroczna, rozgałęziona opowieść o prostodusznym Krzysiu, który wstępuje</text>
        <text x="430" y="280" text-anchor="middle" class="sp-desc-hero">do Policji Rzecznej pod komendą kapitana Arvo i wyrusza w górę</text>
        <text x="430" y="302" text-anchor="middle" class="sp-desc-hero">umierającej rzeki na swój krwawy chrzest bojowy.</text>

        <!-- Frameless Play Disc (Zero Square Box!) -->
        <g transform="translate(406, 330)">
          <use href="#play-frameless-disc-lg" />
        </g>
      </g>
    </g>

    <!-- Right-side architectural notes on why 02 + Play disc works -->
    <g transform="translate(924, 96)">
      <text x="0" y="0" class="num">DLACZEGO TEN UKŁAD ROZWIĄZUJE PROBLEM POWTÓRZENIA IKONY:</text>

      <text x="0" y="42" fill="#ffffff" font-family="Georgia, serif" font-size="16">1. Na stronie głównej WWW klikasz Księgę (playbook.svg)</text>
      <text x="0" y="66" class="tag">Ikona otwartej księgi z trójkątem na landing page'u oznacza: „otwórz interaktywny</text>
      <text x="0" y="84" class="tag">Playbook”. Po jej kliknięciu księga otwiera się na karcie tytułowej opowieści.</text>

      <text x="0" y="132" fill="#ffffff" font-family="Georgia, serif" font-size="16">2. Wewnątrz karty tytułowej (02) klikasz czysty Play (play.svg)</text>
      <text x="0" y="156" class="tag">Zamiast klikać drugi raz tę samą ikonę książki, czytelnik widzi mroczną okładkę,</text>
      <text x="0" y="174" class="tag">tytuł, autora, opis fabuły i czysty, bezramkowy przycisk startu nagrania/lektury.</text>

      <text x="0" y="222" fill="#ffffff" font-family="Georgia, serif" font-size="16">3. Trzy opcje jak jeszcze lepiej rozdzielić rolę ikony Playbooka (poniżej):</text>
      <text x="0" y="246" class="tag">• Opcja A (WWW vs Eksport): Na WWW czysty dysk play.svg, a w samodzielnym</text>
      <text x="0" y="264" class="tag">  eksporcie Web/WASM (otwieranym z linku bez WWW) — ikona playbook.svg.</text>
      <text x="0" y="288" class="tag">• Opcja B (Sygnatura formatu): Dysk play.svg w centrum, a znak playbook.svg</text>
      <text x="0" y="306" class="tag">  jako stała pieczęć formatu „MOJRA.PLAYBOOK” w rogu lub stopce.</text>
      <text x="0" y="330" class="tag">• Opcja C (Start bez splasha na WWW): Kliknięcie playbook.svg na WWW od razu</text>
      <text x="0" y="348" class="tag">  uruchamia WASM (bo kliknięcie na WWW już odblokowuje audio w przeglądarce!).</text>
    </g>
  </g>

  <!-- ================================================================================= -->
  <!-- BOTTOM ROW: 3 WAYS TO PROMOTE PLAYBOOK.SVG WITHOUT DUPLICATION ON WWW             -->
  <!-- ================================================================================= -->

  <!-- OPTION A: WWW = PLAY.SVG, STANDALONE WEB EXPORT = PLAYBOOK.SVG -->
  <g transform="translate(56, 650)">
    <rect width="496" height="382" class="card" />
    <text x="24" y="30" class="num">OPCJA A / W SAMODZIELNYM EKSPORCIE WEB: IKONA PLAYBOOK</text>
    <line x1="24" y1="44" x2="472" y2="44" stroke="#222222" stroke-width="1" />

    <g transform="translate(24, 60)">
      <rect width="448" height="272" class="win-bg" />
      <g clip-path="url(#standalone-viewport-clip)">
        <image href="../books/nie-boj-sie-policji-rzecznej/images/cover.jpg" x="1" y="1" width="446" height="270" preserveAspectRatio="xMidYMid slice" opacity="0.48" />
        <rect x="1" y="1" width="446" height="270" fill="url(#coverStageVignette)" />

        <text x="224" y="84" text-anchor="middle" class="sp-title-sm">Nie bój się policji rzecznej</text>
        <text x="224" y="106" text-anchor="middle" class="sp-author-sm">SEWER HREHOROWICZ</text>
        <line x1="210" y1="118" x2="238" y2="118" stroke="#3a3a3a" stroke-width="1" />
        <text x="224" y="138" text-anchor="middle" class="sp-desc-sm">Mroczna, rozgałęziona opowieść o prostodusznym Krzysiu,</text>
        <text x="224" y="154" text-anchor="middle" class="sp-desc-sm">który wyrusza w górę umierającej rzeki na krwawy chrzest bojowy.</text>

        <!-- Standalone Web Export has no WWW landing page before it, so playbook.svg shines here! -->
        <g transform="translate(202, 178)">
          <use href="#play-frameless-playbook-sm" />
        </g>
      </g>
    </g>

    <text x="24" y="358" class="tag">W wyeksportowanej paczce Web nie ma wcześniej strony WWW — tam gracz klika w Playbooka.</text>
  </g>

  <!-- OPTION B: CLEAN PLAY DISC IN CENTER + PLAYBOOK BADGE IN TOPBAR / FOOTER -->
  <g transform="translate(592, 650)">
    <rect width="496" height="382" class="card" />
    <text x="24" y="30" class="num">OPCJA B / NA WWW: DYSK PLAY W CENTRUM + ZNAK W PASKU</text>
    <line x1="24" y1="44" x2="472" y2="44" stroke="#222222" stroke-width="1" />

    <g transform="translate(24, 60)">
      <rect width="448" height="272" class="win-bg" />
      <rect width="448" height="24" class="win-top" />
      <g transform="translate(10, 5)">
        <use href="#ico-topbar-playbook" />
        <text x="22" y="10.5" class="win-label">MOJRA.PLAYBOOK</text>
      </g>
      <g transform="translate(428, 8)" stroke="#787878" stroke-width="1.2">
        <line x1="0" y1="0" x2="8" y2="8" />
        <line x1="8" y1="0" x2="0" y2="8" />
      </g>

      <g clip-path="url(#sm-viewport-clip)">
        <image href="../books/nie-boj-sie-policji-rzecznej/images/cover.jpg" x="1" y="25" width="446" height="246" preserveAspectRatio="xMidYMid slice" opacity="0.48" />
        <rect x="1" y="25" width="446" height="246" fill="url(#coverStageVignette)" />

        <text x="224" y="98" text-anchor="middle" class="sp-title-sm">Nie bój się policji rzecznej</text>
        <text x="224" y="120" text-anchor="middle" class="sp-author-sm">TYTUS CZYŻEWSKI</text>
        <line x1="210" y1="132" x2="238" y2="132" stroke="#3a3a3a" stroke-width="1" />
        <text x="224" y="152" text-anchor="middle" class="sp-desc-sm">Mroczna, rozgałęziona opowieść o prostodusznym Krzysiu,</text>
        <text x="224" y="168" text-anchor="middle" class="sp-desc-sm">który wyrusza w górę umierającej rzeki na krwawy chrzest bojowy.</text>

        <g transform="translate(205, 190)">
          <use href="#play-frameless-disc-sm" />
        </g>
      </g>
    </g>

    <text x="24" y="358" class="tag">Na WWW klikasz Playbooka na stronie, a w oknie wita Cię okładka z opisem i czystym Play.</text>
  </g>

  <!-- OPTION C: SUBTLE PLAYBOOK WATERMARK SEAL BELOW OR ABOVE TITLE -->
  <g transform="translate(1128, 650)">
    <rect width="496" height="382" class="card" />
    <text x="24" y="30" class="num">OPCJA C / PIECZĘĆ FORMATU NA DOLE EKRANU STARTOWEGO</text>
    <line x1="24" y1="44" x2="472" y2="44" stroke="#222222" stroke-width="1" />

    <g transform="translate(24, 60)">
      <rect width="448" height="272" class="win-bg" />
      <rect width="448" height="24" class="win-top" />
      <g transform="translate(10, 5)">
        <use href="#ico-topbar-mojra" />
        <text x="20" y="10.5" class="win-label">MOJRA PLAYER</text>
      </g>
      <g transform="translate(428, 8)" stroke="#787878" stroke-width="1.2">
        <line x1="0" y1="0" x2="8" y2="8" />
        <line x1="8" y1="0" x2="0" y2="8" />
      </g>

      <g clip-path="url(#sm-viewport-clip)">
        <image href="../books/nie-boj-sie-policji-rzecznej/images/cover.jpg" x="1" y="25" width="446" height="246" preserveAspectRatio="xMidYMid slice" opacity="0.48" />
        <rect x="1" y="25" width="446" height="246" fill="url(#coverStageVignette)" />

        <text x="224" y="88" text-anchor="middle" class="sp-title-sm">Nie bój się policji rzecznej</text>
        <text x="224" y="108" text-anchor="middle" class="sp-author-sm">TYTUS CZYŻEWSKI</text>
        <text x="224" y="132" text-anchor="middle" class="sp-desc-sm">Mroczna, rozgałęziona opowieść o prostodusznym Krzysiu,</text>
        <text x="224" y="148" text-anchor="middle" class="sp-desc-sm">który wyrusza w górę umierającej rzeki na krwawy chrzest bojowy.</text>

        <g transform="translate(205, 168)">
          <use href="#play-frameless-disc-sm" />
        </g>

        <!-- Subtle bottom format seal -->
        <g transform="translate(166, 242)" opacity="0.55">
          <use href="#ico-topbar-playbook" />
          <text x="22" y="10.5" class="sp-badge">INTERACTIVE PLAYBOOK</text>
        </g>
      </g>
    </g>

    <text x="24" y="358" class="tag">Dyskretna sygnatura „INTERACTIVE PLAYBOOK” u dołu ekranu, a przycisk startu to czysty Play.</text>
  </g>
</svg>
