<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #050505; }
      .panel { fill: #000000; stroke: #242424; stroke-width: 1; }
      .panel-strong { fill: #000000; stroke: #525252; stroke-width: 1; }
      .div { stroke: #1a1a1a; stroke-width: 1; }
      .line-strong { stroke: #525252; stroke-width: 1; }
      .line-focus { stroke: #ffffff; stroke-width: 1; }
      .line-subtle { stroke: #242424; stroke-width: 1; }

      .sec-num { fill: #666666; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
      .sec-tag { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; letter-spacing: 1.2px; text-anchor: end; }

      .brand { fill: #ffffff; font-family: "Aleo", serif; font-size: 14px; font-weight: 700; }
      .tab { fill: #949494; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 400; }
      .tab-active { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 700; }

      .node-title { fill: #ffffff; font-family: "Aleo", serif; font-size: 14px; font-weight: 700; }
      .node-title-dim { fill: #525252; font-family: "Aleo", serif; font-size: 14px; font-weight: 700; }
      .node-choice { fill: #c8c8c8; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; }
      .node-choice-dim { fill: #444444; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; }

      .insp-title { fill: #ffffff; font-family: "Aleo", serif; font-size: 18px; font-weight: 700; }
      .modal-title { fill: #ffffff; font-family: "Aleo", serif; font-size: 22px; font-weight: 700; }
      .chapter-kicker { fill: #949494; font-family: "Lato", sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1.1px; }
      .match-badge { fill: #949494; font-family: "Lato", sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-anchor: end; }
      .match-badge-active { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-anchor: end; }

      .search-input { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 13px; font-weight: 400; }
      .search-count { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; text-anchor: end; }

      .res-title { fill: #ffffff; font-family: "Aleo", serif; font-size: 13px; font-weight: 700; }
      .res-id { fill: #7a7a7a; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; }
      .res-snippet { fill: #949494; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 400; }
      .res-hit { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 700; }

      .prose { fill: #c8c8c8; font-family: "Aleo", serif; font-size: 13px; font-weight: 400; }
      .prose-hit { fill: #ffffff; font-family: "Aleo", serif; font-size: 13px; font-weight: 700; }

      .meta-key { fill: #949494; font-family: "Lato", sans-serif; font-size: 10px; font-weight: 400; }
      .meta-val { fill: #ffffff; font-family: "Lato", sans-serif; font-size: 11px; font-weight: 400; }

      .icon { fill: none; stroke: #c8c8c8; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-active { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-muted { fill: none; stroke: #7a7a7a; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .bracket { fill: none; stroke: #ffffff; stroke-width: 1.1; }
    </style>

    <!-- 24px Canvas Grid Pattern -->
    <pattern id="grid-24" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="1.5" height="1.5" fill="#1c1c1c" />
    </pattern>

    <!-- Icons (14x14) -->
    <g id="ico-search">
      <circle cx="6" cy="6" r="4.2" />
      <line x1="9.2" y1="9.2" x2="12.8" y2="12.8" />
    </g>

    <g id="ico-close">
      <line x1="3.5" y1="3.5" x2="10.5" y2="10.5" />
      <line x1="10.5" y1="3.5" x2="3.5" y2="10.5" />
    </g>

    <g id="ico-edit">
      <path d="M9.5 2.5l2 2L5 11H3V9l6.5-6.5z" />
    </g>

    <g id="ico-settings">
      <circle cx="7" cy="7" r="2.2" />
      <path d="M7 1.8v1.4M7 10.8v1.4M1.8 7h1.4M10.8 7h1.4M3.3 3.3l1 1M9.7 9.7l1 1M10.7 3.3l-1 1M4.3 9.7l-1 1" />
    </g>

    <g id="ico-braces">
      <path d="M5 2.5H3.5v9H5M9 2.5h1.5v9H9" />
    </g>

    <g id="ico-history">
      <circle cx="7" cy="7" r="5" />
      <polyline points="7 4.2 7 7 9.2 8.4" />
    </g>

    <!-- Universal 4-Corner Selection Brackets (22x22) -->
    <g id="brackets-22" class="bracket">
      <path d="M 0,4.5 V 0 H 4.5" />
      <path d="M 17.5,0 H 22 V 4.5" />
      <path d="M 0,17.5 V 22 H 4.5" />
      <path d="M 17.5,22 H 22 V 17.5" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" class="bg" />

  <!-- ================================================================================= -->
  <!-- SECTION 01: GŁÓWNY WIDOK PLAYBOOK STUDIO Z AKTYWNĄ WYSZUKIWARKĄ (CMD+F)           -->
  <!-- ================================================================================= -->
  <text x="48" y="42" class="sec-num">01 / WYSZUKIWARKA W PLAYBOOK STUDIO (CMD+F LUB IKONA LUPY W PASKU NARZĘDZI)</text>
  <text x="1392" y="42" class="sec-tag">PODŚWIETLENIE WĘZŁÓW NA PŁÓTNIE WEBGL + SKOK KAMERY DO SCENY + INSPEKTOR 320PX</text>

  <g transform="translate(48, 58)">
    <!-- App Window Frame (1344 x 490) -->
    <rect x="0" y="0" width="1344" height="490" class="panel" />

    <!-- ROW 1: #topbar (ALWAYS VISIBLE, z-index: 200) -->
    <rect x="0" y="0" width="1344" height="38" fill="#000000" />
    <line x1="0" y1="38" x2="1344" y2="38" class="line-subtle" />
    <text x="18" y="24" class="brand">M Mojra</text>
    <line x1="88" y1="11" x2="88" y2="27" class="line-subtle" />
    <text x="106" y="23" class="tab">Biblioteka</text>
    <text x="182" y="23" class="tab">Nie bój się Policji Rzecznej</text>
    <text x="348" y="23" class="tab-active">Playbook Studio</text>
    <use href="#ico-close" x="1314" y="12" class="icon-muted" />

    <!-- ROW 2: .canvas-toolbar -->
    <rect x="0" y="39" width="1344" height="36" fill="#050505" />
    <line x1="0" y1="75" x2="1344" y2="75" class="line-subtle" />
    <text x="18" y="61" class="sec-num" fill="#ffffff">NIE BÓJ SIĘ POLICJI RZECZNEJ</text>

    <!-- Center Zoom Controls -->
    <text x="640" y="61" class="tab">−   100%   +</text>

    <!-- Right Toolbar Icons: Search (Active with 4-corner brackets), Settings, Variables, History -->
    <g transform="translate(1196, 46)">
      <use href="#brackets-22" x="0" y="0" />
      <use href="#ico-search" x="4" y="4" class="icon-active" />
    </g>
    <use href="#ico-settings" x="1234" y="50" class="icon-muted" />
    <use href="#ico-braces" x="1266" y="50" class="icon-muted" />
    <use href="#ico-history" x="1298" y="50" class="icon-muted" />

    <!-- WORKSPACE BODY: Left Canvas (1024px) + Right 320px Inspector -->
    <g transform="translate(0, 76)">
      <!-- WebGL Canvas Area (1024 x 414) -->
      <rect x="0" y="0" width="1024" height="414" fill="url(#grid-24)" />

      <!-- Chapter Group Box on Canvas -->
      <rect x="48" y="48" width="912" height="336" fill="none" stroke="#242424" stroke-dasharray="4 4" />
      <text x="64" y="68" class="chapter-kicker">ZATOPIONA ŚLUZA</text>

      <!-- Wire 1: Node 1 (Dimmed) -> Node 2 (MATCHED) -->
      <path d="M 288,162 H 336 V 144 H 384" fill="none" stroke="#333333" stroke-width="1.2" />
      <!-- Wire 2: Node 2 (MATCHED) -> Node 3 (MATCHED) -->
      <path d="M 624,156 H 672 V 144 H 720" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <!-- Wire 3: Node 2 (MATCHED) -> Node 4 (Dimmed) -->
      <path d="M 624,182 H 672 V 288 H 720" fill="none" stroke="#333333" stroke-width="1.2" />

      <!-- NODE 1: Dimmed (Non-matching scene on canvas) -->
      <g transform="translate(72, 108)" opacity="0.38">
        <rect x="0" y="0" width="216" height="96" fill="#000000" stroke="#242424" stroke-width="1" />
        <text x="14" y="24" class="node-title-dim">Wrota śluzy</text>
        <line x1="0" y1="36" x2="216" y2="36" stroke="#1a1a1a" />
        <text x="14" y="56" class="node-choice-dim">Wpłyń do kanału</text>
        <circle cx="216" cy="53" r="3.5" fill="#444444" />
      </g>

      <!-- NODE 2: MATCHED & SELECTED SCENE (Highlighted white border) -->
      <g transform="translate(384, 96)">
        <rect x="-3" y="-3" width="246" height="126" fill="none" stroke="#525252" stroke-width="1" />
        <rect x="0" y="0" width="240" height="120" fill="#000000" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="0" cy="48" r="4" fill="#ffffff" />
        <text x="16" y="26" class="node-title">Kanał kwarantanny</text>
        <line x1="0" y1="38" x2="240" y2="38" class="line-subtle" />
        <text x="16" y="60" class="node-choice">Oświetl barkę latarką</text>
        <circle cx="240" cy="56" r="4" fill="#ffffff" />
        <line x1="0" y1="70" x2="240" y2="70" class="line-subtle" />
        <text x="16" y="90" class="node-choice">Ukryj łódź przy śluzie</text>
        <circle cx="240" cy="86" r="4" fill="#949494" />
      </g>

      <!-- NODE 3: MATCHED SCENE (Secondary match on canvas) -->
      <g transform="translate(720, 96)">
        <rect x="0" y="0" width="216" height="96" fill="#000000" stroke="#c8c8c8" stroke-width="1.2" />
        <circle cx="0" cy="48" r="3.5" fill="#ffffff" />
        <text x="16" y="26" class="node-title">Barka szpitalna</text>
        <line x1="0" y1="38" x2="216" y2="38" class="line-subtle" />
        <text x="16" y="60" class="node-choice">Przeszukaj kajutę</text>
        <circle cx="216" cy="56" r="3.5" fill="#949494" />
      </g>

      <!-- NODE 4: Dimmed (Non-matching scene on canvas) -->
      <g transform="translate(720, 240)" opacity="0.38">
        <rect x="0" y="0" width="216" height="96" fill="#000000" stroke="#242424" stroke-width="1" />
        <circle cx="0" cy="48" r="3.5" fill="#444444" />
        <text x="16" y="26" class="node-title-dim">Stary jaz</text>
        <line x1="0" y1="38" x2="216" y2="38" stroke="#1a1a1a" />
        <text x="16" y="60" class="node-choice-dim">Zejdź na brzeg</text>
      </g>

      <!-- ========================================================================= -->
      <!-- FLOATING STUDIO SEARCH PALETTE (#studio-search-palette, 440px wide)       -->
      <!-- ========================================================================= -->
      <g transform="translate(292, 16)">
        <rect x="0" y="0" width="440" height="238" class="panel-strong" />

        <!-- Minimalist 1px Bottom-Line Search Input Row -->
        <use href="#ico-search" x="16" y="15" class="icon-active" />
        <text x="38" y="26" class="search-input">Niedźwiedź|</text>
        <text x="396" y="25" class="search-count">3</text>
        <use href="#ico-close" x="410" y="15" class="icon-muted" />
        <line x1="16" y1="36" x2="424" y2="36" class="line-focus" />

        <!-- Result Row 1 (Selected / Active) -->
        <g transform="translate(0, 44)">
          <rect x="1" y="0" width="438" height="62" fill="#0e0e0e" />
          <line x1="0" y1="0" x2="0" y2="62" stroke="#ffffff" stroke-width="2" />
          <text x="16" y="18" class="res-title">Kanał kwarantanny</text>
          <text x="152" y="18" class="res-id">kanal_kwarantanny</text>
          <text x="394" y="17" class="match-badge-active">PROZA</text>
          <use href="#ico-edit" x="408" y="7" class="icon-active" />

          <text x="16" y="36" class="chapter-kicker">ZATOPIONA ŚLUZA</text>
          <text x="16" y="52" class="res-snippet">...pod komendą sierżanta <tspan class="res-hit">Niedźwiedzia</tspan> odbiła od głównego koryta...</text>
          <line x1="0" y1="62" x2="440" y2="62" class="line-subtle" />
        </g>

        <!-- Result Row 2 -->
        <g transform="translate(0, 106)">
          <text x="16" y="18" class="res-title">Barka szpitalna</text>
          <text x="128" y="18" class="res-id">barka_szpitalna</text>
          <text x="394" y="17" class="match-badge">DIALOG</text>
          <use href="#ico-edit" x="408" y="7" class="icon-muted" />

          <text x="16" y="36" class="chapter-kicker">ZATOPIONA ŚLUZA</text>
          <text x="16" y="52" class="res-snippet"><tspan class="res-hit">NIEDŹWIEDŹ</tspan>: Zgaście latarnie. Ktoś jest na pokładzie.</text>
          <line x1="0" y1="62" x2="440" y2="62" class="line-subtle" />
        </g>

        <!-- Result Row 3 -->
        <g transform="translate(0, 168)">
          <text x="16" y="18" class="res-title">Pacyfikacja osady</text>
          <text x="142" y="18" class="res-id">pacyfikacja_osady</text>
          <text x="394" y="17" class="match-badge">WYBÓR</text>
          <use href="#ico-edit" x="408" y="7" class="icon-muted" />

          <text x="16" y="36" class="chapter-kicker">W GÓRĘ UMIERAJĄCEJ RZEKI</text>
          <text x="16" y="52" class="res-snippet">Ostrzeż sierżanta <tspan class="res-hit">Niedźwiedzia</tspan> -> kruk_z_piekiel</text>
        </g>
      </g>

      <!-- ========================================================================= -->
      <!-- RIGHT-SIDE 320PX SCENE INSPECTOR (#editor-context-panel)                  -->
      <!-- ========================================================================= -->
      <g transform="translate(1024, 0)">
        <rect x="0" y="0" width="320" height="414" fill="#000000" />
        <line x1="0" y1="0" x2="0" y2="414" class="line-subtle" />

        <text x="20" y="28" class="chapter-kicker">ZATOPIONA ŚLUZA</text>
        <use href="#ico-close" x="288" y="16" class="icon-muted" />
        <text x="20" y="54" class="insp-title">Kanał kwarantanny</text>
        <line x1="20" y1="64" x2="300" y2="64" class="line-strong" />

        <text x="20" y="90" class="meta-key">id:</text>
        <text x="68" y="90" class="meta-val">kanal_kwarantanny</text>
        <line x1="68" y1="96" x2="300" y2="96" class="line-strong" />

        <text x="20" y="122" class="meta-key">image:</text>
        <text x="68" y="122" class="meta-val">images/kanal_kwarantanny.png</text>
        <line x1="68" y1="128" x2="280" y2="128" class="line-strong" />

        <text x="20" y="154" class="meta-key">voice:</text>
        <text x="68" y="154" class="meta-val">voice/kanal_kwarantanny.flac</text>
        <line x1="68" y1="160" x2="280" y2="160" class="line-strong" />

        <line x1="0" y1="180" x2="320" y2="180" class="line-subtle" />
        <text x="20" y="206" class="prose">Nocna szpica pod komendą sierżanta</text>
        <text x="20" y="226" class="prose"><tspan class="prose-hit">Niedźwiedzia</tspan> odbiła od głównego koryta</text>
        <text x="20" y="246" class="prose">w wąski kanał dawnej kwarantanny...</text>
      </g>
    </g>
  </g>

  <!-- ================================================================================= -->
  <!-- SECTION 02: WYSZUKIWANIE PO ID / LOKACJI     SECTION 03: SKOK DO EDYTORA TEKSTU   -->
  <!-- ================================================================================= -->
  <text x="48" y="588" class="sec-num">02 / FILTROWANIE PO ID, LOKACJI LUB ZMIENNEJ</text>
  <text x="660" y="588" class="sec-tag">NATYCHMIASTOWE DOPASOWANIE</text>

  <g transform="translate(48, 604)">
    <rect x="0" y="0" width="612" height="252" class="panel" />

    <g transform="translate(24, 22)">
      <rect x="0" y="0" width="564" height="208" class="panel-strong" />

      <!-- Search Input -->
      <use href="#ico-search" x="16" y="15" class="icon-active" />
      <text x="38" y="26" class="search-input">WN. BARKA|</text>
      <text x="520" y="25" class="search-count">2</text>
      <use href="#ico-close" x="534" y="15" class="icon-muted" />
      <line x1="16" y1="36" x2="548" y2="36" class="line-focus" />

      <!-- Match 1: Slugline / Location -->
      <g transform="translate(0, 44)">
        <rect x="1" y="0" width="562" height="62" fill="#0e0e0e" />
        <line x1="0" y1="0" x2="0" y2="62" stroke="#ffffff" stroke-width="2" />
        <text x="16" y="18" class="res-title"><tspan class="res-hit">WN. BARKA</tspan> SZPITALNA - NOC</text>
        <text x="234" y="18" class="res-id">barka_szpitalna</text>
        <text x="518" y="17" class="match-badge-active">LOKACJA</text>
        <use href="#ico-edit" x="532" y="7" class="icon-active" />
        <text x="16" y="36" class="chapter-kicker">AKT I • SCENA 4</text>
        <text x="16" y="52" class="res-snippet">Zardzewiałe łóżka polowe stoją wzdłuż burty. Woda kapie ze stropu.</text>
        <line x1="0" y1="62" x2="564" y2="62" class="line-subtle" />
      </g>

      <!-- Match 2: Subslug inside scene text -->
      <g transform="translate(0, 106)">
        <text x="16" y="18" class="res-title">PL. KANAŁ KWARANTANNY - NOC</text>
        <text x="252" y="18" class="res-id">kanal_kwarantanny</text>
        <text x="518" y="17" class="match-badge">SCENA</text>
        <use href="#ico-edit" x="532" y="7" class="icon-muted" />
        <text x="16" y="36" class="chapter-kicker">AKT I • SCENA 3</text>
        <text x="16" y="52" class="res-snippet">...wchodzi pod pokład -> <tspan class="res-hit">WN. BARKA</tspan> SZPITALNA - CIĄG DALSZY</text>
      </g>
    </g>
  </g>

  <!-- SECTION 03: OTWARCIE W #MODAL-SCENE-TEXT (IKONA EDYCJI / SHIFT+ENTER) -->
  <text x="700" y="588" class="sec-num">03 / OTWARCIE W #MODAL-SCENE-TEXT</text>
  <text x="1392" y="588" class="sec-tag">#TOPBAR WIDOCZNY • ZAZNACZENIE FRAZY</text>

  <g transform="translate(700, 604)">
    <rect x="0" y="0" width="692" height="252" class="panel" />

    <!-- #topbar always visible above #modal-scene-text -->
    <rect x="0" y="0" width="692" height="34" fill="#000000" />
    <line x1="0" y1="34" x2="692" y2="34" class="line-subtle" />
    <text x="16" y="22" class="brand">M Mojra</text>
    <line x1="82" y1="9" x2="82" y2="25" class="line-subtle" />
    <text x="98" y="21" class="tab">Biblioteka</text>
    <text x="168" y="21" class="tab">Nie bój się Policji Rzecznej</text>
    <text x="326" y="21" class="tab-active">Playbook Studio</text>
    <use href="#ico-close" x="664" y="10" class="icon-muted" />

    <!-- #modal-scene-text content below #topbar -->
    <g transform="translate(48, 54)">
      <text x="0" y="14" class="chapter-kicker">ZATOPIONA ŚLUZA</text>
      <text x="0" y="42" class="modal-title">Kanał kwarantanny</text>
      <use href="#ico-close" x="582" y="26" class="icon-active" />
      <line x1="0" y1="54" x2="596" y2="54" class="line-subtle" />

      <!-- Prose with highlighted search match -->
      <text x="0" y="84" class="prose">Nocna szpica pod komendą sierżanta</text>
      <rect x="220" y="70" width="90" height="18" fill="#242424" stroke="#ffffff" stroke-width="1" />
      <text x="224" y="84" class="prose-hit">Niedźwiedzia</text>
      <text x="316" y="84" class="prose">odbiła od głównego koryta</text>
      <text x="0" y="108" class="prose">w wąski, wyłożony cegłą kanał dawnej kwarantanny. Nad wodą wisiał ciężki</text>
      <text x="0" y="132" class="prose">odór zardzewiałego żelaza i gnijącego drewna.</text>
    </g>
  </g>
</svg>
