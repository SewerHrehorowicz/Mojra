TrHelpMK1: Grab grip (⋮⋮)
TrHelpMD1: Moves the scene node on the canvas with automatic 24 px grid snapping. Clicking a node opens its details in the side panel.
TrHelpMK2: Background drag / Shift + Click
TrHelpMD2: Selects multiple nodes at once (marquee box or additive click). Dragging one selected node moves the entire group.
TrHelpMK3: Chapter groups
TrHelpMD3: Each chapter forms a group frame around its scenes. The chapter header moves all its scenes, renames the chapter, or adds a scene.
TrHelpMK4: Double-click / Right-click background
TrHelpMD4: Creates a new scene at the clicked canvas position or opens the context menu.
TrHelpMK5: Output ports (bottom / right)
TrHelpMD5: A linear scene has a bottom output port (default “Next” transition). With 2+ choices (+ Choice), output ports appear on the right of each choice.
TrHelpMK6: Space + drag / Middle mouse
TrHelpMD6: Pans the canvas view. You can also pan using right mouse button drag.
TrHelpMK7: Mouse wheel / Pinch gesture
TrHelpMD7: Zooms the canvas view in and out around the cursor.
TrHelpMK8: Auto-layout
TrHelpMD8: Automatically arranges all scenes and chapters into a clean tree on the grid.
