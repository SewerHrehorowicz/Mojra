TrHelpMK5: Porty wyjściowe (dół / prawo)
TrHelpMD5: Scena bez rozwidleń posiada dolny port wyjściowy (domyślne przejście „Dalej”). Po dodaniu wyborów (+ Wybór, min. 2) porty wyjściowe pojawiają się po prawej stronie każdego wyboru.
TrHelpMK6: Spacja + przeciągnięcie / ŚPM
TrHelpMD6: Przesuwa widok płótna (Pan). Możesz również przesuwać widok prawym przyciskiem myszy (PPM + przeciągnięcie).
