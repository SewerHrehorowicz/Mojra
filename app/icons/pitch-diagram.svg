<svg viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left: Single Source (.playtxt + Playbook Studio) -->
  <line x1="16" y1="36" x2="16" y2="184" stroke="#262626" stroke-width="1"/>
  <circle cx="16" cy="110" r="5.5" fill="#ffffff"/>
  <text x="36" y="94" fill="#686868" font-family="SF Mono, Menlo, monospace" font-size="9.5" font-weight="600" letter-spacing="2">JEDNO ŹRÓDŁO</text>
  <text x="36" y="118" fill="#ffffff" font-family="Georgia, serif" font-size="20">Playbook Studio</text>
  <text x="36" y="138" fill="#787878" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="300">Tekst + Głos + Warianty + Zmienne</text>

  <!-- Origin Double-Ring Node -->
  <circle cx="244" cy="110" r="8" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="244" cy="110" r="2.8" fill="#ffffff"/>

  <!-- Branching Bezier Threads to 4 Markets -->
  <path d="M 252 110 C 316 110, 332 32, 392 32" stroke="#484848" stroke-width="1.2"/>
  <path d="M 252 110 C 316 110, 332 84, 392 84" stroke="#ffffff" stroke-width="1.4"/>
  <path d="M 252 110 C 316 110, 332 136, 392 136" stroke="#888888" stroke-width="1.2"/>
  <path d="M 252 110 C 316 110, 332 188, 392 188" stroke="#484848" stroke-width="1.2"/>

  <!-- Output 1: Interaktywny Audiobook & E-book -->
  <circle cx="392" cy="32" r="4" fill="#ffffff"/>
  <text x="412" y="36" fill="#ffffff" font-family="Georgia, serif" font-size="14.5">Interaktywny Audiobook i E-book (.playbook)</text>
  <text x="868" y="36" text-anchor="end" fill="#686868" font-family="SF Mono, Menlo, monospace" font-size="9.5" letter-spacing="1.6">CZYTNIK MOJRA</text>

  <!-- Output 2: Scenariusz Filmowy / PISF -->
  <circle cx="392" cy="84" r="4" fill="#000000" stroke="#ffffff" stroke-width="1.6"/>
  <text x="412" y="88" fill="#ffffff" font-family="Georgia, serif" font-size="14.5">Scenariusz Filmowy PDF (PISF) + Raport 1/8 str.</text>
  <text x="868" y="88" text-anchor="end" fill="#686868" font-family="SF Mono, Menlo, monospace" font-size="9.5" letter-spacing="1.6">FILM &amp; SERIAL</text>

  <!-- Output 3: Słuchowiska i Dubbing -->
  <circle cx="392" cy="136" r="4" fill="#ffffff"/>
  <text x="412" y="140" fill="#ffffff" font-family="Georgia, serif" font-size="14.5">Słuchowisko Wieloobsadowe i Skrypty Ról</text>
  <text x="868" y="140" text-anchor="end" fill="#686868" font-family="SF Mono, Menlo, monospace" font-size="9.5" letter-spacing="1.6">STUDIA AUDIO</text>

  <!-- Output 4: Gry Narracyjne i WebAssembly -->
  <circle cx="392" cy="188" r="4" fill="#000000" stroke="#ffffff" stroke-width="1.6"/>
  <text x="412" y="192" fill="#ffffff" font-family="Georgia, serif" font-size="14.5">Gra Narracyjna (WASM / Desktop / Mobile)</text>
  <text x="868" y="192" text-anchor="end" fill="#686868" font-family="SF Mono, Menlo, monospace" font-size="9.5" letter-spacing="1.6">GAMEDEV</text>
