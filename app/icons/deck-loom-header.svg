    <line x1="860" y1="0" x2="860" y2="320"/>
    <line x1="884" y1="0" x2="884" y2="320"/>
    <line x1="908" y1="0" x2="908" y2="320"/>
    <line x1="932" y1="0" x2="932" y2="320"/>
    <line x1="956" y1="0" x2="956" y2="320"/>
    <line x1="980" y1="0" x2="980" y2="320"/>

    <!-- Horizontal grid lines every 24px -->
    <line x1="0" y1="20" x2="1000" y2="20"/>
    <line x1="0" y1="44" x2="1000" y2="44"/>
    <line x1="0" y1="68" x2="1000" y2="68"/>
    <line x1="0" y1="92" x2="1000" y2="92"/>
    <line x1="0" y1="116" x2="1000" y2="116"/>
    <line x1="0" y1="140" x2="1000" y2="140"/>
    <line x1="0" y1="164" x2="1000" y2="164"/>
    <line x1="0" y1="188" x2="1000" y2="188"/>
    <line x1="0" y1="212" x2="1000" y2="212"/>
    <line x1="0" y1="236" x2="1000" y2="236"/>
    <line x1="0" y1="260" x2="1000" y2="260"/>
    <line x1="0" y1="284" x2="1000" y2="284"/>
    <line x1="0" y1="308" x2="1000" y2="308"/>
  </g>

  <!-- Radial vignette over grid (exact website formula) -->
  <rect width="1000" height="320" fill="url(#whiteRadialFade)"/>

  <!-- Exact sparse geometric constellation lines from www hero screenshot -->
  <line x1="0" y1="214" x2="116" y2="92" stroke="#111111" stroke-opacity="0.14" stroke-width="1.05"/>
  <line x1="116" y1="92" x2="296" y2="44" stroke="#111111" stroke-opacity="0.15" stroke-width="1.05"/>
  <line x1="296" y1="44" x2="596" y2="20" stroke="#111111" stroke-opacity="0.15" stroke-width="1.05"/>
