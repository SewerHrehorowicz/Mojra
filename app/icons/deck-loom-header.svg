  <line x1="596" y1="20" x2="1000" y2="236" stroke="#111111" stroke-opacity="0.13" stroke-width="1"/>
  <line x1="860" y1="140" x2="1000" y2="126" stroke="#111111" stroke-opacity="0.13" stroke-width="1"/>
  <line x1="860" y1="140" x2="860" y2="276" stroke="#111111" stroke-opacity="0.15" stroke-width="1.05"/>
  <line x1="860" y1="276" x2="948" y2="320" stroke="#111111" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="860" y1="276" x2="776" y2="320" stroke="#111111" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="0" y1="232" x2="101" y2="284" stroke="#111111" stroke-opacity="0.14" stroke-width="1.05"/>
  <line x1="101" y1="284" x2="76" y2="320" stroke="#111111" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Exact sparse nodes (hollow rings & solid dots) from www hero screenshot -->
  <circle cx="116" cy="92" r="3.4" fill="#111111" fill-opacity="0.36"/>
  <circle cx="296" cy="44" r="4.6" fill="#ffffff" stroke="#111111" stroke-opacity="0.40" stroke-width="1.35"/>
  <circle cx="596" cy="20" r="3.4" fill="#111111" fill-opacity="0.38"/>
  <circle cx="860" cy="140" r="4.6" fill="#ffffff" stroke="#111111" stroke-opacity="0.40" stroke-width="1.35"/>
  <circle cx="101" cy="284" r="4.4" fill="#ffffff" stroke="#111111" stroke-opacity="0.34" stroke-width="1.3"/>
  <circle cx="860" cy="276" r="3.4" fill="#111111" fill-opacity="0.34"/>

  <!-- Smooth bottom fade into white paper -->
  <rect width="1000" height="320" fill="url(#whiteBottomFade)"/>
