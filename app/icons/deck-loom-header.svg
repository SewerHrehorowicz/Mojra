<svg viewBox="0 0 1000 320" preserveAspectRatio="xMidYMin slice" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pure vector white vignette overlays (no PDF /Pattern or /SMask rasterization bugs in macOS Preview) -->
    <radialGradient id="whiteRadialFade" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="whiteBottomFade" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Explicit continuous 24px vector grid lines (never clipped by PDF tiling pattern boundaries) -->
  <g stroke="#000000" stroke-opacity="0.075" stroke-width="0.85">
    <!-- Vertical grid lines every 24px (centered around x=500) -->
    <line x1="20" y1="0" x2="20" y2="320"/>
    <line x1="44" y1="0" x2="44" y2="320"/>
    <line x1="68" y1="0" x2="68" y2="320"/>
    <line x1="92" y1="0" x2="92" y2="320"/>
    <line x1="116" y1="0" x2="116" y2="320"/>
    <line x1="140" y1="0" x2="140" y2="320"/>
    <line x1="164" y1="0" x2="164" y2="320"/>
    <line x1="188" y1="0" x2="188" y2="320"/>
    <line x1="212" y1="0" x2="212" y2="320"/>
    <line x1="236" y1="0" x2="236" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="284" y1="0" x2="284" y2="320"/>
    <line x1="308" y1="0" x2="308" y2="320"/>
    <line x1="332" y1="0" x2="332" y2="320"/>
    <line x1="356" y1="0" x2="356" y2="320"/>
    <line x1="380" y1="0" x2="380" y2="320"/>
    <line x1="404" y1="0" x2="404" y2="320"/>
    <line x1="428" y1="0" x2="428" y2="320"/>
    <line x1="452" y1="0" x2="452" y2="320"/>
    <line x1="476" y1="0" x2="476" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="524" y1="0" x2="524" y2="320"/>
    <line x1="548" y1="0" x2="548" y2="320"/>
    <line x1="572" y1="0" x2="572" y2="320"/>
    <line x1="596" y1="0" x2="596" y2="320"/>
    <line x1="620" y1="0" x2="620" y2="320"/>
    <line x1="644" y1="0" x2="644" y2="320"/>
    <line x1="668" y1="0" x2="668" y2="320"/>
    <line x1="692" y1="0" x2="692" y2="320"/>
    <line x1="716" y1="0" x2="716" y2="320"/>
    <line x1="740" y1="0" x2="740" y2="320"/>
    <line x1="764" y1="0" x2="764" y2="320"/>
    <line x1="788" y1="0" x2="788" y2="320"/>
    <line x1="812" y1="0" x2="812" y2="320"/>
